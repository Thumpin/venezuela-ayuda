name: Relock (temporal)

# Workflow temporal para regenerar package-lock.json en Linux (Node 22) y
# subirlo como artefacto. Resuelve el desfase de @swc/helpers que solo aparece
# en la resolución de npm en Linux. Se elimina una vez committeado el lock.
on:
  push:
    branches:
      - feat/ci-lint-typecheck-tests
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  relock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerar lockfile en Linux
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --no-audit --no-fund
          echo "=== @swc/helpers en el nuevo lock ==="
          node -e "const l=require('./package-lock.json');for(const k of Object.keys(l.packages)){if(k.includes('@swc/helpers'))console.log(k, l.packages[k].version)}"
      - name: Verificar npm ci con el lock regenerado
        run: |
          rm -rf node_modules
          npm ci --no-audit
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1
