name: CI

# Ejecuta lint, typecheck y la suite de tests en cada PR. Los scripts ya viven en
# package.json (`lint`, `test`) pero hasta ahora solo se corrían a mano. Este
# workflow cierra el hueco: ningún PR mergea sin pasar estas validaciones.
on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # --no-optional: el lock fija @swc/helpers 0.5.15 (lo que pina next),
      # pero next-intl arrastra @swc/core con un peer OPCIONAL >=0.5.17. En el
      # runner de Linux ese choque hace que `npm ci` exija 0.5.23 y falle.
      # Como es un peer opcional, omitir las opcionales lo evita sin perder
      # reproducibilidad de las deps reales. Ver #36.
      - run: npm ci --no-optional
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
